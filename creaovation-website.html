      accessibility:{title:'Interaction should meet people where they are.',lede:'Give people more ways to express the same intent, without designing a separate interface for every person.',modalities:['Sign','Gaze','Gesture','Voice','Context'],key:['Sign','Gaze'],problem:['Assistive interaction is often added after the primary interface has already hardened around a keyboard, mouse, and visual targets.','The result is not just an accessibility gap. It is a context gap: systems still need to know what a person refers to, across the signals that work for them.'],inputs:[['ASL','OPEN'],['Gaze','Fixating message_204'],['Gesture','Pointing to inbox row']],json:'{\n  "intent": "open",\n  "target": "message_204",\n  "context": "inbox",\n  "confidence": 0.93\n}',outcomes:[['More expression','Support equivalent intent through the signals a person prefers.'],['Shared context','Connect alternative inputs to the objects already in the interface.'],['Less adaptation','Reduce the need to learn a special command grammar.']]},
      spatial:{title:'Give spatial AI a shared reference frame.',lede:'Turn where someone looks, points, moves, and speaks into context that spatial applications can act on.',modalities:['Voice','Gaze','Gesture','Touch','Vision','Context'],key:['Gaze','Gesture'],problem:['Spatial environments contain many candidate objects, regions, and planes. Language alone is rarely precise enough to identify one.','A useful interaction layer needs to align language with direction, attention, scene understanding, and the state of the experience.'],inputs:[['Voice','“Put that one over there.”'],['Gaze','Asset 88'],['Gesture','Zone west']],json:'{\n  "intent": "place",\n  "target": "asset_88",\n  "destination": "zone_west",\n  "confidence": 0.94\n}',outcomes:[['Shared attention','Resolve what a person is looking at before they name it.'],['Natural instruction','Let people speak and point in the same motion.'],['Spatial confidence','Give downstream systems a score before acting.']]},

      industrial:{title:'Let work stay in motion.',lede:'Give hands-busy workers an interface that understands the equipment, instruction, and place they are already focused on.',modalities:['Voice','Gaze','Gesture','Vision','Context'],key:['Voice','Vision'],problem:['Industrial work happens around equipment, protective gear, and time-sensitive operations. Traditional interfaces force a context switch exactly when attention is scarce.','An interaction layer can preserve the worker’s focus by combining the instruction with the asset, area, and task already in view.'],inputs:[['Voice','“Why is this one alarming?”'],['Gesture','Pointing to unit'],['Vision','Asset tag PMP-3104']],json:'{\n  "intent": "diagnose",\n  "target": "asset_pmp_3104",\n  "confidence": 0.91\n}',outcomes:[['Hands remain busy','Ask and act without a keyboard between the work and the answer.'],['Asset precision','Resolve equipment against an actual tagged environment.'],['Auditable actions','Keep the resolved context with every recommendation.']]},
      enterprise:{title:'Bring AI into the way work already happens.',lede:'Combine pen, voice, touch, and application state so people can refer to live work instead of constructing prompts around it.',modalities:['Voice','Pen','Touch','Vision','Context'],key:['Pen','Voice'],problem:['Knowledge work moves between documents, dashboards, meetings, and annotations. Each surface holds context that a prompt box cannot reliably infer.','The interaction layer gives AI the references people already use: the range they circle, the report they view, and the quarter they compare.'],inputs:[['Pen','Circle around D12:D24'],['Voice','“Compare this to last quarter.”'],['Context','Q2 workbook']],json:'{\n  "intent": "compare",\n  "target": "range_D12_D24",\n  "against": "period_prior_quarter",\n  "confidence": 0.95\n}',outcomes:[['Less prompt work','Act on the visible work instead of a reconstructed description.'],['Native context','Use documents and screens as structured interaction surfaces.'],['Clear provenance','Keep source references attached to each result.']]},

    const PROSE={
      engine:{group:'Product',title:'The interaction engine',lede:'Six inspectable operations that turn asynchronous human signals into a stable, useful representation of intent.',quote:'A resolution you cannot inspect is a resolution you cannot ship.',body:['The Interaction Engine is not a perception model. It is the layer that synchronizes existing model outputs and connects them to the state of the product where interaction is happening.','It aligns signals in time, resolves references against a context graph, weights competing evidence, and returns a normalized event with a confidence score. Each decision remains inspectable.','That lets an application decide whether to act, confirm, or clarify. The engine does not hide ambiguity; it makes ambiguity a first-class part of the API.']},
      integrations:{group:'Product',title:'Bring your own providers',lede:'Keep the perception technologies that already work for you, and change providers without rewriting product interaction logic.',quote:'Swapping a speech vendor should be a configuration change, not a rewrite.',body:['Creaovation sits above the providers that capture and classify individual signals. Speech, hand tracking, gaze estimation, digital ink, visual perception, and foundation models remain choices.','The engine normalizes their outputs into the same interaction vocabulary. Your application consumes one event shape even when the underlying provider changes.','That separation lets teams evaluate providers on the job they do best, while preserving the interaction logic that makes their experience distinctive.']},
      security:{group:'Product',title:'Control where interaction data lives',lede:'A deployment model that keeps perception, context, and policy in the places your product requires.',quote:'The default should be that raw signals never leave the device that captured them.',body:['Human interaction data can be sensitive because it describes attention, movement, voice, and surrounding context. The architecture supports local, edge, cloud, and hybrid deployment patterns.','Raw capture can stay close to the device while normalized intent travels to the application. Context retention, logging, and confidence thresholds remain explicit design choices.','The point is not to impose a single security model. It is to give teams the layer they need to make their own policies implementable.']},
      examples:{group:'Developers',title:'Implementation patterns',lede:'Small, focused patterns for bringing natural interaction into real application workflows.',quote:'The best interaction integration is the one that disappears into the product.',body:['A typical integration starts by registering the context already present in your application. It then listens for normalized intent events and maps those events to existing product actions.','Examples cover reference resolution in a document editor, multimodal object selection in a spatial scene, and confidence-aware commands in a vehicle interface.','Each pattern keeps the product in control: the application decides its action vocabulary, confirmation behavior, and relevant state.']},
      research:{group:'Resources',title:'Multimodal intelligence needs an interaction layer',lede:'A research perspective on the gap between model capability and human communication.',quote:'Models are becoming interchangeable. Interfaces are not.',body:['Models are becoming better at individual modalities. They can transcribe speech, recognize objects, read handwriting, track hands, and reason over language.','But a human interaction is often distributed across all of them. The difficult work is deciding which signals belong together, what they refer to, and when there is enough confidence to act.','That is why the interaction layer will become a product boundary in its own right: independent from the models beneath it and the applications above it.']},
      guides:{group:'Resources',title:'Designing for confidence-aware AI',lede:'A practical guide to deciding when an AI system should act, confirm, or ask a short clarifying question.',quote:'Confidence is not a score to hide. It is a product behavior to design.',body:['A useful threshold model has three bands. High confidence allows a reversible or expected action. Medium confidence presents a short confirmation. Low confidence requests clarification and supplies candidates when possible.','The threshold should reflect the cost of being wrong, not the novelty of the interface. A quick selection can tolerate more uncertainty than a robotics command or a vehicle control.','When teams expose this behavior early, users learn the system’s boundaries and trust grows through predictable recovery.']},
      partners:{group:'Company',title:'Build the open interaction ecosystem',lede:'Creaovation works with the companies advancing perception, intelligent systems, and the environments where people use them.',quote:'Provider independence only means something if the providers are in the room.',body:['The interaction layer is valuable because it connects an ecosystem. Providers can specialize in capture and perception while applications can specialize in the experience they create.','We are looking for partners building modality technologies, intelligent devices, spatial platforms, accessibility systems, enterprise software, and robotics.','The shared goal is an open layer where products can use the right capabilities without forcing people to learn how to speak to a machine.']}

    function home(){return `<section class="hero hero--home"><div class="container center"><div class="hero-copy rv">${eyebrow('Human interaction infrastructure for AI',true)}${headline('Give AI a better way','to understand people.',true)}<p class="lede">Creaovation connects voice, gaze, gesture, pen, touch, sign language, and visual context into one interaction layer that AI applications can understand.</p><p class="lede" style="font-size:16px;margin-top:12px">Integrate the perception technologies you need, normalize their signals, and turn natural human interaction into structured intent for any AI system.</p><div class="actions">${btn('Start building','#/developers')}${btn('Book a demo','#/contact',true)}</div></div>${signalFlow()}</div></section><section class="section"><div class="container editorial"><div class="rv"><div class="content">${head('The problem','AI can see and hear.','Understanding people is harder.','Modern AI applications can process speech, images, video, and text.')}</div></div><div class="cadence stagger">${['We look at something while speaking.','We point while giving instructions.','We circle an object and write beside it.','We gesture toward what we mean.','We refer to things using words like “this,” “that,” and “there.”'].map((x,i)=>`<p class="rv" style="--i:${i}">${x}</p>`).join('')}</div><p class="editorial-close rv">Developers are left connecting these signals themselves.<br>Creaovation provides the missing interaction layer.</p></div></section><section class="section section--warm"><div class="container">${head('Platform','Many signals.','One understanding.','Creaovation brings human interaction signals together and converts them into structured context your application can use.')}<div class="grid grid--4 stagger">${CAPS.map(([t,d],i)=>`<div class="rv" style="--i:${i}">${card(t,d,t==='Sign Language'?'Sign':t)}</div>`).join('')}</div></div></section><section class="section"><div class="container steps-layout"><div class="sticky-head rv">${head('How it works','From human signal','to usable intent.')}</div><div class="steps stagger">${STEPS.map(([n,l,t,b,d],i)=>`<article class="step rv" style="--i:${i}"><span class="step-num">${n}</span><div>${eyebrow(l)}<h3>${t}</h3><p>${b}</p>${d?`<small>${d}</small>`:''}</div></article>`).join('')}</div></div></section><section class="section dark"><div class="container"><div class="showcase-intro rv"><div>${headline('Built for how people','actually communicate.')}</div><p>Your users should not have to adapt themselves to AI. Creaovation gives your product the infrastructure to understand interaction the way people naturally express it.</p></div>${liveDemo()}</div></section><section class="section section--warm"><div class="container">${head('Why Creaovation','Build the interaction.','Not the integration maze.')}<div class="grid grid--4 stagger">${[['Provider independent','Use the perception models and providers that work best for your product.'],['Multimodal by design','Combine signals instead of treating every interaction channel separately.'],['Model independent','Connect the interaction layer to whichever AI models or systems you choose.'],['Developer ready','One SDK and unified event structure instead of maintaining multiple interaction stacks.']].map(([t,d],i)=>`<div class="rv" style="--i:${i}">${card(t,d)}</div>`).join('')}</div></div></section><section class="section"><div class="container">${head('Solutions','Human interaction infrastructure','for every environment.')}<div class="grid grid--3 stagger">${SOLS.map(([t,d,r],i)=>`<div class="rv" style="--i:${i}">${card(t,d,'',r)}</div>`).join('')}</div></div></section><section class="section section--warm"><div class="container code-split"><div class="rv">${head('Developers','One interaction API.','Any AI system.','Add natural human interaction to your product without rebuilding the perception stack.')}<div class="actions" style="display:flex;gap:12px;flex-wrap:wrap">${btn('Explore documentation','#/documentation')}${btn('View API','#/api-reference',true)}</div></div><div class="rv">${codeBlock('app.ts','<span class="kw">import</span> { Creaovation } <span class="kw">from</span> <span class="str">"@creaovation/sdk"</span>\n\ninteraction.<span class="fn">on</span>(<span class="str">"intent"</span>, event =&gt; {\n  application.<span class="fn">execute</span>(event)\n})')}</div></div></section>${closing('Build AI that understands','how people actually communicate.','Creaovation gives product teams one infrastructure layer for turning natural interaction into usable AI context.','#/developers','Start building','#/contact','Talk to sales')}`}

esigned to sit above perception providers.')}<p class="lede" style="margin:0 0 18px">Choose your preferred:</p><div class="provider-list rv">${['Speech provider.','Gaze technology.','Hand tracking system.','Vision models.','Digital ink engine.','Sign language system.','Foundation model.'].map(x=>`<span>${x}</span>`).join('')}</div><p class="lede" style="font-size:16px">Change providers later without rebuilding your application interaction logic.</p></div></section><section class="section dark"><div class="container">${head('Reference resolution','Give meaning to “this,” “that,”','and “there.”','Human communication depends heavily on context. Creaovation combines interaction history, application state, visual information, gaze, gesture, and language to determine what a person is referring to.',{dot:true})}<div class="cycle"><p class="cycle-note">That enables interactions like:</p><div id="utterances">${['“Open <mark>that</mark>.”','“Move <mark>this</mark> <mark>there</mark>.”','“Compare <mark>these two</mark>.”','“Use the <mark>one</mark> I circled.”','“Tell me why <mark>that</mark> is flashing.”'].map((x,i)=>`<div class="utterance ${i===0?'active':''}">${x}</div>`).join('')}</div></div></div></section><section class="section section--warm"><div class="container">${head('Confidence','Every resolution arrives','with a score.','',{dot:true})}<div class="thresholds stagger">${[['0.90 to 1.00','Act','High confidence. The application executes the intent directly.','100%'],['0.60 to 0.89','Confirm','The intent is clear but the target is not certain. Show what will happen before acting.','72%'],['Below 0.60','Clarify','Candidates are returned instead of a target. Ask a short question rather than guessing.','40%']].map(([r,t,d,w],i)=>`<article class="threshold rv" style="--i:${i}"><span class="range">${r}</span><div class="bar"><i style="width:${w}"></i></div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section"><div class="container">${head('Go deeper','More of the','interaction layer.')} ${crossLinks(['engine','integrations','security'])}</div></section>`}
    function developers(){let codes={JavaScript:'<span class="kw">import</span> { Creaovation } <span class="kw">from</span> <span class="str">"@creaovation/sdk"</span>\n\ninteraction.<span class="fn">on</span>(<span class="str">"intent"</span>, execute)',Python:'<span class="kw">from</span> creaovation <span class="kw">import</span> Interaction\n\ninteraction.<span class="fn">on</span>(<span class="str">"intent"</span>, execute)',Swift:'<span class="kw">import</span> Creaovation\n\ninteraction.<span class="fn">onIntent</span> { event <span class="kw">in</span>\n  execute(event)\n}'};return `<section class="hero"><div class="container center"><div class="rv">${head('Developers','Natural interaction.','One integration.','Build voice, gaze, gesture, touch, pen, sign, and contextual interaction into your application through a unified developer layer.',{dot:true})}<div class="actions">${btn('Read the docs','#/documentation')}${btn('Get an API key','#/contact',true)}</div></div></div></section><section class="section"><div class="container"><div class="grid grid--4 stagger">${[['Integrate once','One SDK for interaction events.'],['Normalize everything','Consistent schemas across providers.'],['Choose your stack','Bring your existing AI and perception technologies.'],['Deploy your way','Cloud, edge, local, or hybrid.']].map(([t,d],i)=>`<div class="rv" style="--i:${i}">${card(t,d)}</div>`).join('')}</div></div></section><section class="section dark"><div class="container code-split"><div class="rv">${head('Quickstart','Listening for intent','takes four lines.','',{dot:true})}<div class="tabs" role="tablist">${Object.keys(codes).map((x,i)=>`<button class="tab" role="tab" data-tab="${x}" aria-selected="${i===0}">${x}</button>`).join('')}</div></div><div class="rv">${Object.entries(codes).map(([x,c],i)=>`<div class="tab-panel ${i===0?'active':''}" data-panel="${x}">${codeBlock(x.toLowerCase()==='javascript'?'app.ts':x.toLowerCase()==='python'?'app.py':'App.swift',c)}</div>`).join('')}</div></div></section><section class="section section--warm"><div class="container">${head('Event schema','A single, predictable','event shape.','',{dot:true})}<div class="schema-wrap rv"><table class="schema"><tbody>${[['intent','string','The normalized action the person expressed, drawn from your registered action vocabulary.'],['target','object or null','The resolved object the intent applies to. Null when the reference could not be resolved.'],['candidates','array','Present only when target is null. Ranked possible targets with individual scores.'],['modalities','string[]','Which signals contributed to this resolution, in order of weight.'],['context','object','The application state the engine used, so a resolution can be replayed and audited.'],['confidence','number','Fusion confidence from 0 to 1. Your thresholds decide what happens next.'],['timestamp','ISO 8601','The aligned time of the interaction, not the arrival time of the last signal.']].map(([k,t,d])=>`<tr><td>${k}<small>${t}</small></td><td>${d}</td></tr>`).join('')}</tbody></table></div></div></section><section class="section"><div class="container ambiguity"><div class="rv">${head('Handling ambiguity','When confidence is low,','ask.','Candidates give your interface a short, specific recovery path.',{dot:true})}</div><div class="rv">${codeBlock('event.json','{\n  <b>"intent"</b>: <em>"select"</em>,\n  <b>"target"</b>: <span class="kw">null</span>,\n  <b>"candidates"</b>: [<em>"asset_18"</em>, <em>"asset_19"</em>],\n  <b>"suggested_action"</b>: <em>"clarify"</em>\n}')}</div></div></section><section class="section section--warm"><div class="container">${head('Documentation','Everything you need','to start building.')}<div class="docs rv">${DOCS.map((x,i)=>`<a href="#/${i===0?'documentation':i===1?'sdks':i===5?'api-reference':'examples'}">${x}${arrow()}</a>`).join('')}</div></div></section><section class="section"><div class="container">${head('SDKs','Bring interaction to','every runtime.')}<div class="grid grid--4">${[['JavaScript','npm install @creaovation/sdk'],['Python','pip install creaovation'],['Swift','package add Creaovation'],['Unity','Package Manager · Creaovation']].map(([t,i])=>`<article class="card sdk"><h3>${t}</h3><span class="install">${i}</span></article>`).join('')}</div></div></section>`}
    function solutions(){let rows=[['Accessibility',['fill','ring','ring','ring','—','ring']],['Automotive',['fill','fill','ring','fill','—','fill']],['Industrial',['fill','ring','fill','—','—','fill']],['Spatial computing',['ring','fill','fill','ring','—','fill']],['Enterprise',['fill','—','—','fill','fill','ring']],['Robotics',['fill','ring','fill','—','—','fill']]];return `<section class="hero"><div class="container center"><div class="rv">${head('Solutions','Human interaction changes','across every environment.','Creaovation gives product teams a common infrastructure layer while allowing each experience to use the interaction modalities that make sense.',{dot:true})}</div></div></section><section class="section"><div class="container"><div class="grid grid--3 stagger">${SOLS.map(([t,d,r],i)=>`<div class="rv" style="--i:${i}">${card(t,d,'',r)}</div>`).join('')}</div></div></section><section class="section section--warm"><div class="container">${head('Modality matrix','The same layer,','weighted differently.')}<div class="matrix-wrap rv"><table class="matrix"><thead><tr><th>Environment</th>${['Voice','Gaze','Gesture','Touch','Pen','Vision'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(([name,vals])=>`<tr><td>${name}</td>${vals.map(v=>`<td>${v==='—'?'—':`<i class="dot ${v==='fill'?'fill':''}"></i>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i class="dot fill"></i>Primary modality</span><span><i class="dot"></i>Secondary modality</span><span>— Not typical</span></div></div></section>${closing('Not sure which modalities','your product needs?','Map the interaction problem before committing to the stack.','#/contact','Talk to Creaovation')}`}
    function resources(){return `<section class="hero hero--left"><div class="container"><div class="hero-copy rv">${head('Resources','Thinking about the future','of human AI interaction.','Research, engineering perspectives, and product thinking on how humans and intelligent systems will communicate.',{dot:true})}</div></div></section><section class="section"><div class="container"><div class="filters" role="tablist">${['All','Research','Engineering','Product'].map((x,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${x}" role="tab" aria-selected="${i===0}">${x}</button>`).join('')}</div><article class="featured rv"><div><span class="article-meta">RESEARCH · AUG 24, 2026</span><h2>Why multimodal AI still needs an interaction layer</h2></div><p>Models can process more signals than ever. But the meaning between those signals still has to be resolved.</p></article><div class="article-rows">${ARTICLES.slice(1).map(([t,c,d])=>`<a href="#/article" class="article-row" data-category="${c}"><h3>${t}</h3><div>${c} · ${d}<br>→</div></a>`).join('')}</div></div></section><section class="section section--warm"><div class="container">${head('Continue reading','Explore the interaction','layer.')} ${crossLinks(['research','guides','documentation'])}</div></section>`}
    function about(){return `<section class="hero"><div class="container center"><div class="rv">${head('Company','Who we are','','Creaovation is building the interaction infrastructure that helps AI understand how people naturally communicate.',{dot:true})}</div></div></section><section class="section"><div class="container"><div class="abstract rv" role="img" aria-label="Four translucent stacked planes crossed by converging lines at a shared central point."><i class="plane pa"></i><i class="plane pb"></i><i class="plane pc"></i><i class="plane pd"></i><i class="core"></i></div></div></section><section class="section"><div class="container editorial"><div class="rv"><div class="content">${head('','The future of AI needs','a better human interface.','AI intelligence has advanced rapidly.')}</div><p class="lede">Human interaction with AI has not.</p><p class="lede">Most systems still require people to adapt themselves to the interface.</p></div><div class="cadence stagger">${['Type the right prompt.','Speak the right command.','Select the right menu.','Explain what “that” means.'].map((x,i)=>`<p class="rv" style="--i:${i}">${x}</p>`).join('')}</div><div class="editorial-close rv">Creaovation is building the infrastructure that reverses that relationship.<br>We believe technology should understand how people already communicate.<div class="modalities">${['Speech.','Movement.','Writing.','Touch.','Vision.','Sign.','Context.'].map(x=>`<span>${x}</span>`).join('')}</div></div></div></section><section class="section section--warm"><div class="container"><div class="statements rv"><div class="statement">${eyebrow('Our mission')}<p>Make natural human interaction understandable to any intelligent system.</p></div><div class="statement">${eyebrow('Our vision')}<p>A world where people interact with intelligence naturally, without having to learn how to speak to machines.</p></div></div></div></section><section class="section"><div class="container"><div class="philosophy rv"><p>We are not building another model.</p><p>The world already has increasingly capable models for speech, vision, language, handwriting, gesture, gaze, and perception.</p><p>The challenge is making those capabilities work together.</p><p>Creaovation connects them.</p></div></div></section><section class="section section--warm"><div class="container">${head('Principles','Designed around','human understanding.')}<div class="grid grid--3">${[['Human first','Technology should adapt to people.'],['Open infrastructure','Customers should not be locked into one model or perception provider.'],['Context matters','Human signals have meaning because of what surrounds them.'],['Accessible by default','Interaction infrastructure should expand who can use technology.'],['Developer focused','Complex perception infrastructure should feel simple to integrate.']].map(([t,d])=>card(t,d)).join('')}</div></div></section><section class="section"><div class="container"><div class="content">${head('Direction','Where we are','going.')}</div><div class="timeline rv">${[['2024','Founded',''],['2025','First deployments',''],['2026','Open provider layer','current'],['Next','Ambient interaction','']].map(([y,t,c])=>`<div class="timeline-item ${c}"><strong>${y}</strong><span>${t}</span></div>`).join('')}</div></div></section><section class="section dark"><div class="container">${head('Company','Build the ecosystem','with us.')} ${crossLinks(['partners','careers'],'two')}</div></section>`}
    function contact(){return `<section class="hero"><div class="container center"><div class="rv">${head('Contact','Let’s build more natural','human AI interaction.','Whether you are building an AI application, intelligent device, accessibility experience, vehicle interface, or spatial computing product, we would like to understand what you are working on.',{dot:true})}</div></div></section><section class="section"><div class="container contact-grid"><form class="form-card rv" id="contactForm" novalidate><h2>Tell us what you are building.</h2><div class="form-grid">${field('First name','text',true)}${field('Last name','text',true)}${field('Work email','email',true,true)}${field('Company','text',true,true)}<div class="field full"><label for="building">What are you building? <em>*</em></label><select id="building" required><option value="">Select an option</option>${['AI application','Intelligent device','Accessibility experience','Vehicle interface','Spatial computing','Robotics','Enterprise software','Something else'].map(x=>`<option>${x}</option>`).join('')}</select><span class="field-error">Choose an option to continue.</span></div><div class="field full"><label for="message">Message</label><textarea id="message" rows="5"></textarea></div></div><button class="btn btn--primary" type="submit">Talk to Creaovation ${arrow()}</button><p class="form-note">We will only use this to respond to your enquiry.</p><p class="form-status" id="formStatus" role="status">Thanks — your enquiry is ready to send. Connect this form to a real endpoint before launch.</p></form><div class="contact-info rv">${[['General','hello@creaovation.com','✉'],['Developers','developers@creaovation.com','⌘'],['Partnerships','partners@creaovation.com','◇']].map(([t,e,i])=>`<article class="info-card"><span class="info-icon">${i}</span><p>${t}</p><a href="mailto:${e}">${e}</a></article>`).join('')}</div></div></section><section class="section section--warm"><div class="container">${head('Next steps','Three steps,','about two weeks.')}<div class="nextsteps">${[['01','Introduction call','Thirty minutes. You describe the interaction problem, we tell you honestly whether the layer helps.'],['02','Interaction mapping','We map your modalities, providers, and application state to an event schema for your product.'],['03','Pilot integration','A scoped build against one workflow, with your existing perception providers in place.']].map(([n,t,d])=>`<article class="nextstep"><strong>${n}</strong><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section"><div class="container faq-layout"><div class="sticky-head rv">${head('FAQ','Questions about','the interaction layer.','How Creaovation fits alongside the models, providers, and systems you already use.')}</div>${accordion(FAQ)}</div></section>`}
    function field(label,type,req=false,full=false){let id=label.toLowerCase().replace(/ /g,'-');return `<div class="field ${full?'full':''}"><label for="${id}">${label} ${req?'<em>*</em>':''}</label><input id="${id}" type="${type}" ${req?'required':''}><span class="field-error">This field is required.</span></div>`}
    function accordion(items){return `<div class="accordion rv">${items.map(([q,a],i)=>`<article class="accordion-item"><button aria-expanded="${i===0}">${q}<span class="plus"></span></button><div class="accordion-panel ${i===0?'open':''}"><p>${a}</p></div></article>`).join('')}</div>`}
    function solDetail(key){let d=SOL_DETAIL[key];return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb"><a href="#/solutions">Solutions</a><span>→</span><span>${d.title.split(' ').slice(0,2).join(' ')}</span></div>${headline(d.title)}<p class="lede">${d.lede}</p><div class="tag-row">${d.modalities.map(x=>`<span class="tag ${d.key.includes(x)?'key':''}">${x}</span>`).join('')}</div></div></div></section><section class="section"><div class="container steps-layout"><div class="sticky-head rv">${head('Environment','Why this environment','is hard.')}</div><div class="prose rv"><p>${d.problem[0]}</p><p>${d.problem[1]}</p></div></div></section><section class="section dark"><div class="container"><div class="section-head rv">${head('Worked example','One act of communication,','resolved.','')}</div>${liveDemo(d.inputs,esc(d.json).replace(/&quot;/g,'"').replace(/\n/g,'<br>'),['Your AI','Your application','Your device'])}</div></section><section class="section section--warm"><div class="container">${head('Outcomes','What changes','for this environment.')}<div class="outcome-grid stagger">${d.outcomes.map(([t,x],i)=>`<div class="rv" style="--i:${i}">${card(t,x)}</div>`).join('')}</div></div></section><section class="section"><div class="container">${head('Other environments','The interaction layer','adapts.')} ${crossLinks(Object.keys(SOL_DETAIL).filter(x=>x!==key).slice(0,3).map(x=>x==='spatial'?'engine':'integrations'))}</div></section>${closing('Build interaction around','the people in it.','','#/contact','Talk to Creaovation')}`}
    function proseDetail(key){let d=PROSE[key];return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb"><a href="#/${d.group==='Product'?'product':d.group==='Developers'?'developers':d.group==='Resources'?'resources':'about'}">${d.group}</a><span>→</span><span>${d.title}</span></div>${headline(d.title)}<p class="lede">${d.lede}</p></div></div></section><section class="section"><div class="container"><article class="prose rv">${d.body.map((p,i)=>`${i===1?`<blockquote>${d.quote}</blockquote>`:''}<p>${p}</p>`).join('')}<h2>Built for an open interaction stack.</h2><ul><li>Use the providers and models that suit your product.</li><li>Keep application context under your product’s control.</li><li>Return structured intent with inspectable confidence.</li></ul></article></div></section>${closing('Build the layer','your product needs.','','#/contact','Talk to Creaovation')}`}
    function docsDetail(kind){if(kind==='documentation')return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb">Developers <span>→</span><span>Documentation</span></div>${headline('Documentation')}<p class="lede">The concepts, schemas, and integration patterns that make natural interaction useful in product.</p></div></div></section><section class="section"><div class="container"><div class="docs rv">${DOCS.map((x,i)=>`<a href="#/${i===1?'sdks':i===5?'api-reference':'examples'}">${x}${arrow()}</a>`).join('')}</div></div></section>${closing('Start with one','interaction.','','#/contact','Get an API key')}`;
      if(kind==='sdks')return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb">Developers <span>→</span><span>SDKs</span></div>${headline('SDKs')}<p class="lede">Connect the interaction API to the application runtime you already use.</p></div></div></section><section class="section section--warm"><div class="container"><div class="grid grid--4">${[['JavaScript','npm install @creaovation/sdk'],['Python','pip install creaovation'],['Swift','package add Creaovation'],['Unity','Package Manager · Creaovation']].map(([t,i])=>`<article class="card sdk"><h3>${t}</h3><span class="install">${i}</span></article>`).join('')}</div></div></section>${closing('One integration,','any interface.','','#/contact','Get an API key')}`;
      if(kind==='api-reference')return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb">Developers <span>→</span><span>API reference</span></div>${headline('Interaction event API')}<p class="lede">A compact schema for carrying resolved intent, context, contributing signals, and confidence.</p></div></div></section><section class="section"><div class="container"><div class="schema-wrap rv"><table class="schema"><tbody>${[['intent','string','Normalized action.'],['target','object or null','Resolved object.'],['candidates','array','Ranked possible targets.'],['modalities','string[]','Contributing signals.'],['context','object','Application state used.'],['confidence','number','Fusion confidence.'],['timestamp','ISO 8601','Aligned interaction time.']].map(([k,t,d])=>`<tr><td>${k}<small>${t}</small></td><td>${d}</td></tr>`).join('')}</tbody></table></div></div></section>${closing('Build with an','inspectable event.','','#/contact','Get an API key')}`;
      return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb">Company <span>→</span><span>Careers</span></div>${headline('Work on how people','interact with intelligence.')}<p class="lede">We are a small team working on the infrastructure that lets products understand natural human communication.</p></div></div></section><section class="section"><div class="container"><div class="docs rv">${[['Founding product engineer','Remote · North America'],['Multimodal systems engineer','Remote · North America'],['Developer experience lead','Remote · North America']].map(([r,l])=>`<a href="#/contact"><span>${r}<small style="display:block;color:var(--muted);font-size:13px">${l}</small></span>${arrow()}</a>`).join('')}</div><p class="lede" style="margin-top:28px">Do not see your role? Send an open application through the contact page.</p></div></section>${closing('Help define the','interaction layer.','','#/contact','Introduce yourself')}`}
    function article(){return `<section class="detail-hero"><div class="container"><div class="content rv"><div class="crumb">Resources <span>→</span><span>Research</span></div>${headline('Why multimodal AI still','needs an interaction layer.')}<p class="lede">Models can process more signals than ever. The difficult work is still deciding what those signals mean together.</p></div></div></section><section class="section"><div class="container"><article class="prose rv"><p style="font-family:var(--mono);font-size:12px;color:var(--quiet)">MARCH 23, 2026 · 8 MIN READ · ZAVIAN NOOR, INTERACTION RESEARCH</p><p>Every team building multimodal AI runs into the same problem. They can capture voice, vision, gesture, and application state, but they have no durable place to decide which pieces belong to a single human act.</p><h2>Modalities are not intent.</h2><p>A transcript tells you what was said. Gaze coordinates tell you where someone looked. A hand tracker tells you where a hand moved. None of them alone tells you what should happen next.</p><blockquote>Every team building multimodal AI ends up writing the same fusion layer, badly, under deadline.</blockquote><p>The interaction layer gives that work an explicit boundary. It aligns individual signals, resolves their references against application context, and returns an inspectable event that an application can use.</p><h2>The interface is the differentiator.</h2><p>As foundation models become more capable and more interchangeable, the way a product understands people becomes a durable part of its experience. The systems that make that layer explicit will be easier to improve, audit, and trust.</p></article></div></section>${closing('Build AI around','human expression.','','#/contact','Talk to Creaovation')}`}
    function route(){let r=location.hash.replace(/^#\/?/,'').replace(/\/$/,'')||'home';let main={home,product,developers,solutions,resources,about,contact};let page=main[r]?main[r]():SOL_DETAIL[r]?solDetail(r):PROSE[r]?proseDetail(r):['documentation','sdks','api-reference','careers'].includes(r)?docsDetail(r):r==='article'?article():home();document.title=r==='home'?'Creaovation — Human Interaction Infrastructure for AI':`${r.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ')} — Creaovation`;$('#app').innerHTML=nav()+`<main id="main">${page}</main>`+footer();bind();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});reveal();setTimeout(reveal,80);if(r==='product')startCycle();}
    function bind(){let menu=$('#mobileSheet');$('#openMenu')?.addEventListener('click',()=>{menu.classList.add('open');menu.querySelector('button').focus()});$('#closeMenu')?.addEventListener('click',()=>menu.classList.remove('open'));menu?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>menu.classList.remove('open')));document.querySelectorAll('.nav-trigger').forEach(x=>{x.addEventListener('click',()=>x.setAttribute('aria-expanded',x.getAttribute('aria-expanded')!=='true'));x.parentElement.addEventListener('mouseleave',()=>x.setAttribute('aria-expanded','false'))});document.querySelectorAll('.accordion-item button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.accordion-item button').forEach(x=>{let on=x===b&&x.getAttribute('aria-expanded')!=='true';x.setAttribute('aria-expanded',on);x.nextElementSibling.classList.toggle('open',on)})}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===b.dataset.tab))}));document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));let f=b.dataset.filter;document.querySelectorAll('.article-row').forEach(x=>x.style.display=f==='All'||x.dataset.category===f?'grid':'none')}));document.addEventListener('click',copyDelegated);let form=$('#contactForm');form?.addEventListener('submit',e=>{e.preventDefault();let valid=true;form.querySelectorAll('[required]').forEach(el=>{let wrap=el.closest('.field');let bad=!el.value.trim();wrap.classList.toggle('invalid',bad);valid&&= !bad});if(valid){$('#formStatus').classList.add('show');$('#formStatus').focus?.()}});let observer=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('paused',!e.isIntersecting)),{threshold:.18});document.querySelectorAll('[data-loop-demo]').forEach(x=>observer.observe(x))}
    function copyDelegated(e){let b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard?.writeText(b.dataset.copy||'');b.textContent='✓';setTimeout(()=>b.textContent='⧉',1300)}
    function reveal(){let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){document.querySelectorAll('.rv').forEach(x=>x.classList.add('show'));return}let ob=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');ob.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.rv:not(.show)').forEach(x=>ob.observe(x))}
    let cycleTimer;function startCycle(){clearInterval(cycleTimer);let n=0,items=[...document.querySelectorAll('.utterance')];cycleTimer=setInterval(()=>{items.forEach((x,i)=>x.classList.toggle('active',i===(n++%items.length)))},2100)}
    addEventListener('hashchange',route);route();
